[package]
name = "norn-eve-plugin"
version = "0.1.0"
edition = "2024"
description = "Norn graph capability sidecar for the Eve plugin ABI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/GameCult/Norn"

[dependencies]
anyhow = "1"
base64 = "0.22"
cultnet-rs = { path = "../../../CultLib/packages/cultnet-rs" }
norn-rs = { path = "../norn-rs" }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
